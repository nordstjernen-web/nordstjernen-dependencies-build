name: build-deps

# Cross-compile the full native third-party dependency stack for every Android
# ABI and publish each as a downloadable "android sysroot" artifact that
# nordstjernen's android/scripts/build-deps.sh (and local devs) can consume
# instead of compiling everything from source.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/deps/**'
      - 'android/scripts/**'
      - 'android/cross/**'
      - '.github/workflows/build-deps.yml'
  schedule:
    # Nightly rebuild (04:17 UTC) to catch toolchain/runner drift.
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: build-deps-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '27.3.13750724'
  ANDROID_API: '34'
  NORDSTJERNEN_ANDROID_VERBOSE: '1'

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upstream configure/meson/cmake scripts from the tarballs run on this
          # runner; nothing here pushes with git, so never leave the token in .git.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool gettext gperf ccache \
            bison flex texinfo nasm yasm
          # Recent Meson/Ninja from PyPI (Ubuntu's are often too old for glib).
          # Exact versions + sha256 (pip --require-hashes): see the requirements file.
          python -m pip install --require-hashes -r .github/requirements-build.txt
          echo "meson $(meson --version), ninja $(ninja --version), cmake $(cmake --version | head -1)"

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          # `yes | sdkmanager` races: sdkmanager closes the pipe early, so `yes`
          # dies with a broken pipe and trips `pipefail`. Guard both calls with
          # `|| true` and use the install-dir check below as the real gate.
          (yes 2>/dev/null | "${SDKMANAGER}" --licenses >/dev/null 2>&1) || true
          (yes 2>/dev/null | "${SDKMANAGER}" "ndk;${NDK_VERSION}" >/dev/null 2>&1) || true
          NDK_HOME="${SDK}/ndk/${NDK_VERSION}"
          test -d "${NDK_HOME}" || { echo "::error::NDK ${NDK_VERSION} install failed"; exit 1; }
          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "Installed NDK at ${NDK_HOME}"

      - name: Cache source tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/.cache/tarballs
          key: deps-tarballs-${{ hashFiles('android/deps/manifest.txt') }}
          restore-keys: |
            deps-tarballs-

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # ccache only speeds up *reruns*; a clean build (the common case here)
        # leans on the parallel source prefetch in build-android-deps.sh instead.
        with:
          path: android/.cache/ccache
          key: deps-ccache-${{ matrix.abi }}-${{ hashFiles('android/deps/manifest.txt') }}-${{ github.sha }}
          restore-keys: |
            deps-ccache-${{ matrix.abi }}-${{ hashFiles('android/deps/manifest.txt') }}-
            deps-ccache-${{ matrix.abi }}-

      - name: Build dependency sysroot (${{ matrix.abi }})
        env:
          NORDSTJERNEN_ANDROID_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          set -euxo pipefail
          chmod +x android/scripts/*.sh
          android/scripts/build-android-deps.sh "${{ matrix.abi }}"

      - name: Upload build logs (${{ matrix.abi }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nordstjernen-android-build-logs-${{ matrix.abi }}
          path: |
            android/cross/*.cross
            android/.build/${{ matrix.abi }}/**/*.log
            android/.build/${{ matrix.abi }}/**/meson-logs/**
            android/.build/${{ matrix.abi }}/**/CMakeFiles/CMake*.yaml
            android/.build/${{ matrix.abi }}/**/CMakeFiles/CMake*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Sanity-check artifact contents
        env:
          NORDSTJERNEN_ANDROID_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          set -euo pipefail
          PREFIX="${NORDSTJERNEN_ANDROID_SYSROOT}/${{ matrix.abi }}"
          echo "== shared libraries =="; ls -1 "${PREFIX}/lib/"*.so
          echo "== pkg-config modules =="; ls -1 "${PREFIX}/lib/pkgconfig/"*.pc
          # Every key module must be discoverable via pkg-config.
          export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"
          for m in zlib libffi libpcre2-8 expat gobject-2.0 gio-2.0 \
                   freetype2 libpng harfbuzz fontconfig pixman-1 fribidi \
                   cairo pango pangocairo libcrypto libssl libnghttp2 \
                   libbrotlidec libbrotlienc libbrotlicommon \
                   libcurl sqlite3 uchardet libpsl libwebp \
                   ogg vorbis vorbisfile opus dav1d vpx; do
            pkg-config --exists "$m" && echo "ok   $m $(pkg-config --modversion "$m")" \
                                     || { echo "MISSING $m"; exit 1; }
          done
          # libcurl must expose only the protocols the engine speaks. Every other
          # protocol is disabled at configure time (see dep_curl); a curl bump that
          # renames a CURL_DISABLE_* option would silently re-enable one.
          protos="$("${PREFIX}/bin/curl-config" --protocols | tr '[:lower:]' '[:upper:]' | tr '\n' ' ')"
          echo "libcurl protocols: ${protos}"
          for p in ${protos}; do
            case "${p}" in HTTP|HTTPS|FTP|FTPS|WS|WSS) : ;; *) echo "::error::libcurl built with unexpected protocol ${p}"; exit 1 ;; esac
          done
          case " ${protos} " in *" HTTPS "*) : ;; *) echo "::error::libcurl lacks HTTPS"; exit 1 ;; esac
          echo "ok   libcurl protocol set is restricted to HTTP(S)/FTP(S)/WS(S)"
          # Confirm libcurl actually linked brotli (decodes `Content-Encoding: br`).
          if command -v readelf >/dev/null; then
            if readelf -dW "${PREFIX}/lib/libcurl.so" | grep -q 'libbrotlidec'; then
              echo "ok   libcurl.so links libbrotlidec (brotli enabled)"
            else
              echo "::error::libcurl.so does not link libbrotlidec"; exit 1
            fi
            # Every shipped .so must have 16 KB-aligned LOAD segments, or it
            # will fail to load on Android 15+ devices with 16 KB pages (a hard
            # Google Play requirement and the whole point of the
            # -Wl,-z,max-page-size=16384 plumbing). A single dep that drops
            # LDFLAGS would otherwise ship mis-aligned and pass every other
            # check, so assert the alignment of each LOAD segment in each lib
            # rather than spot-checking one. (mawk on the runner has no
            # strtonum, so convert the hex Align column in bash arithmetic.)
            fail=0
            for lib in "${PREFIX}/lib/"*.so; do
              base="$(basename "${lib}")"
              while read -r align; do
                [ -n "${align}" ] || continue
                if [ "$(( align ))" -lt 16384 ]; then
                  echo "::error::${base} has a LOAD segment aligned to ${align} (<16 KB)"
                  fail=1
                fi
              done < <(readelf -lW "${lib}" | awk '$1 == "LOAD" { print $NF }')
            done
            [ "${fail}" -eq 0 ] || { echo "::error::one or more libraries are not 16 KB page-aligned"; exit 1; }
            echo "ok   all $(ls -1 "${PREFIX}/lib/"*.so | wc -l) libraries have >=16 KB-aligned LOAD segments"
            # Hardening contract: full RELRO, immediate binding (BIND_NOW) and no
            # text relocations in every shipped .so. The NDK defaults to all three
            # and common.sh passes -z relro -z now explicitly; this catches a dep
            # whose build system drops our LDFLAGS.
            fail=0
            for lib in "${PREFIX}/lib/"*.so; do
              base="$(basename "${lib}")"
              readelf -lW "${lib}" | grep -q 'GNU_RELRO' \
                || { echo "::error::${base} has no GNU_RELRO segment"; fail=1; }
              readelf -dW "${lib}" | grep -Eq 'BIND_NOW|\(FLAGS_1\).*NOW' \
                || { echo "::error::${base} is not linked with -z now (BIND_NOW)"; fail=1; }
              if readelf -dW "${lib}" | grep -q 'TEXTREL'; then
                echo "::error::${base} has text relocations"; fail=1
              fi
            done
            [ "${fail}" -eq 0 ] || { echo "::error::one or more libraries miss RELRO/BIND_NOW or have TEXTREL"; exit 1; }
            echo "ok   all libraries have full RELRO + BIND_NOW and no TEXTREL"
          fi

      - name: Stage artifact tree
        env:
          NORDSTJERNEN_ANDROID_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/artifact"
          mkdir -p "${OUT}"
          cp -a "${NORDSTJERNEN_ANDROID_SYSROOT}/${{ matrix.abi }}" "${OUT}/"
          cp android/deps/manifest.txt "${OUT}/${{ matrix.abi }}/MANIFEST.txt"
          {
            echo "abi=${{ matrix.abi }}"
            echo "ndk=${NDK_VERSION}"
            echo "api=${ANDROID_API}"
            echo "commit=${{ github.sha }}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "meson=$(meson --version)"
            echo "ninja=$(ninja --version)"
            echo "cmake=$(cmake --version | head -1 | awk '{print $3}')"
            echo "clang=$("${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1)"
          } > "${OUT}/${{ matrix.abi }}/BUILDINFO.txt"

      - name: Upload sysroot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nordstjernen-android-sysroot-${{ matrix.abi }}
          # Upload the parent dir so the artifact keeps a top-level <abi>/
          # directory (include/, lib/, lib/pkgconfig/) for build-deps.sh.
          path: artifact/
          if-no-files-found: error
          retention-days: 90

  # Aggregate all four ABIs into a single public GitHub Release so the sysroots
  # are downloadable with plain curl (no auth, no artifact expiry). Runs only
  # when all matrix builds succeed, and only on main / manual / scheduled runs.
  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-26.04
    # Publish ONLY from main: a workflow_dispatch from a feature branch must never
    # overwrite the public release that every engine build consumes. The nightly
    # schedule builds (to catch toolchain drift) but does not publish, so the
    # released assets change only when a commit on main changes them.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    permissions:
      contents: write
      id-token: write      # OIDC identity for the build-provenance attestation
      attestations: write  # store the attestation on this repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upstream configure/meson/cmake scripts from the tarballs run on this
          # runner; nothing here pushes with git, so never leave the token in .git.
          persist-credentials: false

      - name: Download all sysroot artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nordstjernen-android-sysroot-*
          path: artifacts

      - name: Package per-ABI tarballs and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a x86_64; do
            d="artifacts/nordstjernen-android-sysroot-${abi}"
            test -d "${d}/${abi}" || { echo "::error::missing sysroot for ${abi}"; exit 1; }
            # Tarball keeps a top-level <abi>/ dir so it extracts directly into
            # $NORDSTJERNEN_ANDROID_SYSROOT.
            tar -C "${d}" -czf "dist/nordstjernen-android-sysroot-${abi}.tar.gz" "${abi}"
          done
          cp android/deps/manifest.txt dist/manifest.txt
          ( cd dist && sha256sum ./*.tar.gz manifest.txt > SHA256SUMS )
          echo "== release assets =="; ls -lh dist

      # SLSA provenance signed by GitHub's OIDC identity for this workflow run.
      # Consumers verify with: gh attestation verify <asset> --repo <this repo>
      # (fetch-prebuilt-deps.sh does so automatically when gh is installed).
      # Signing talks to the Sigstore transparency log, which occasionally
      # answers 500; retry twice with a pause before giving up. The release
      # steps below run only if an attestation was made, so every published
      # asset is attested (consumers with gh refuse unattested assets).
      - name: Attest build provenance of the release assets (attempt 1)
        id: attest1
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nordstjernen-android-sysroot-*.tar.gz
            dist/SHA256SUMS

      - name: Pause before retrying the attestation
        if: steps.attest1.outcome == 'failure'
        run: sleep 45

      - name: Attest build provenance of the release assets (attempt 2)
        id: attest2
        if: steps.attest1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nordstjernen-android-sysroot-*.tar.gz
            dist/SHA256SUMS

      - name: Pause before the last attestation attempt
        if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure'
        run: sleep 90

      - name: Attest build provenance of the release assets (attempt 3)
        id: attest3
        if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nordstjernen-android-sysroot-*.tar.gz
            dist/SHA256SUMS

      - name: Compute immutable release tag
        id: reltag
        run: echo "tag=sysroot-$(date -u +%Y%m%d)-${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable per-commit release ${{ steps.reltag.outputs.tag }}
        # The rolling '-latest' release below is overwritten in place, so it can
        # never be pinned. This copy is tied to the source commit and is never
        # updated; consumers who want reproducible builds pin this tag.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Android prebuilt sysroot ${{ steps.reltag.outputs.tag }}
          make_latest: false
          body: |
            Immutable build of commit `${{ github.sha }}`. Same assets as the
            rolling `sysroot-latest` release at the time of publishing;
            see `manifest.txt` for the pinned versions and `SHA256SUMS` for checksums.
            Each asset carries a build-provenance attestation
            (`gh attestation verify <asset> --repo ${{ github.repository }}`).
          files: |
            dist/nordstjernen-android-sysroot-*.tar.gz
            dist/SHA256SUMS
            dist/manifest.txt
          fail_on_unmatched_files: true

      - name: Publish rolling 'sysroot-latest' release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: sysroot-latest
          name: Android prebuilt sysroot (latest)
          body: |
            Prebuilt Android dependency sysroot for the Nordstjernen engine.

            - NDK: `${{ env.NDK_VERSION }}`  ·  API/minSdk: `${{ env.ANDROID_API }}`
            - ABIs: arm64-v8a, x86_64 (16 KB page size)
            - Source commit: `${{ github.sha }}`
            - Pinned versions: see `manifest.txt`; checksums in `SHA256SUMS`.

            Consume with:
            ```bash
            export NORDSTJERNEN_ANDROID_SYSROOT="$HOME/.cache/nordstjernen-android-sysroot"
            android/scripts/fetch-prebuilt-deps.sh --sysroot "$NORDSTJERNEN_ANDROID_SYSROOT"
            ```
          files: |
            dist/nordstjernen-android-sysroot-*.tar.gz
            dist/SHA256SUMS
            dist/manifest.txt
          fail_on_unmatched_files: true
