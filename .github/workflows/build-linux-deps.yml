name: build-linux-deps

# Compile a bleeding-edge development GTK 4 on Ubuntu, against the distro's
# system graphics stack, and publish it as a downloadable "Linux GTK overlay"
# so the desktop Nordstjernen engine (and local devs) can test the latest dev
# GTK without waiting for Ubuntu to package it.
#
# Unlike build-deps.yml (Android) and build-ios-deps.yml (iOS), this does NOT
# cross-compile the whole GLib/cairo/pango stack: the desktop port builds
# against the system libraries, so only GTK itself is built from source.

on:
  workflow_dispatch:
  push:
    paths:
      - 'linux/deps/**'
      - 'linux/scripts/**'
      - '.github/workflows/build-linux-deps.yml'
  schedule:
    # Nightly rebuild (05:17 UTC) to catch toolchain/runner drift.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: build-linux-deps-${{ github.ref }}
  cancel-in-progress: true

env:
  NORDSTJERNEN_LINUX_VERBOSE: '1'

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upstream configure/meson/cmake scripts from the tarballs run on this
          # runner; nothing here pushes with git, so never leave the token in .git.
          persist-credentials: false

      - name: Ensure manifest is fully pinned
        # Runs on EVERY branch: an AUTO entry means the tarball is not verified, and
        # nothing unverified may be built by CI, let alone published.
        run: |
          set -euo pipefail
          if awk '!/^[[:space:]]*#/ && NF>=4 {print $3}' linux/deps/manifest.txt \
               | grep -qiw 'AUTO'; then
            echo "::error::manifest still has AUTO (unpinned) checksums; pin them (see the manifest header for the procedure)"
            exit 1
          fi
          echo "ok: all manifest entries are pinned"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install build tools and GTK build dependencies
        run: |
          set -euxo pipefail
          # Enable deb-src so `apt build-dep` can resolve GTK's build deps.
          # Modern Ubuntu images use the deb822 ubuntu.sources; older ones use
          # the legacy sources.list. Handle both idempotently.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E 's/^Types:.*/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/^# *deb-src/deb-src/' /etc/apt/sources.list || true
          fi
          sudo apt-get update
          # Pull GTK's build dependencies straight from the distro: this is the
          # authoritative, rename-proof way to get glib, cairo, pango,
          # gdk-pixbuf, graphene, libepoxy, harfbuzz, wayland, the Vulkan shader
          # compiler, etc. for the exact Ubuntu we build on.
          sudo apt-get build-dep -y gtk4 || sudo apt-get build-dep -y libgtk-4-dev
          # Tooling not guaranteed to be in the build-dep set.
          # GLib's and Pango's own build deps (normally pulled in by libglib2.0-dev,
          # listed explicitly so the overlay's glib/pango builds never depend on it).
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config cmake ccache \
            gettext ca-certificates \
            libffi-dev libpcre2-dev libmount-dev libselinux1-dev zlib1g-dev \
            libfontconfig-dev libfreetype-dev libthai-dev libfribidi-dev
          # Recent Meson/Ninja from PyPI (Ubuntu's can lag GTK's requirement).
          # Exact versions + sha256 (pip --require-hashes): see the requirements file.
          python -m pip install --require-hashes -r .github/requirements-build.txt
          echo "meson $(meson --version), ninja $(ninja --version), cmake $(cmake --version | head -1)"
          echo "gcc $(gcc -dumpfullversion 2>/dev/null || gcc -dumpversion)"

      - name: Cache source tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: linux/.cache/tarballs
          key: linux-deps-tarballs-${{ hashFiles('linux/deps/manifest.txt') }}
          restore-keys: |
            linux-deps-tarballs-

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: linux/.cache/ccache
          key: linux-deps-ccache-${{ matrix.arch }}-${{ hashFiles('linux/deps/manifest.txt') }}-${{ github.sha }}
          restore-keys: |
            linux-deps-ccache-${{ matrix.arch }}-${{ hashFiles('linux/deps/manifest.txt') }}-
            linux-deps-ccache-${{ matrix.arch }}-

      - name: Build GTK overlay (${{ matrix.arch }})
        env:
          NORDSTJERNEN_LINUX_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          set -euxo pipefail
          chmod +x linux/scripts/*.sh
          linux/scripts/build-linux-deps.sh "${{ matrix.arch }}"

      - name: Upload build logs (${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nordstjernen-linux-build-logs-${{ matrix.arch }}
          path: |
            linux/.build/${{ matrix.arch }}/**/*.log
            linux/.build/${{ matrix.arch }}/**/meson-logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Sanity-check artifact contents
        env:
          NORDSTJERNEN_LINUX_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          set -euo pipefail
          PREFIX="${NORDSTJERNEN_LINUX_SYSROOT}/${{ matrix.arch }}"
          echo "== shared libraries =="; ls -1 "${PREFIX}/lib/"libgtk-4.so*
          echo "== pkg-config modules =="; ls -1 "${PREFIX}/lib/pkgconfig/"gtk4*.pc
          # gtk4 must be discoverable via pkg-config and report the pinned
          # version. Prepend our prefix; system dirs stay on the default search
          # path so gtk4.pc's Requires (glib, cairo, pango, ...) still resolve.
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"
          pkg-config --exists gtk4 || { echo "::error::gtk4 not found via pkg-config"; exit 1; }
          GOT="$(pkg-config --modversion gtk4)"
          WANT="$(awk '$1=="gtk"{print $2}' linux/deps/manifest.txt)"
          echo "gtk4 pkg-config version: ${GOT} (manifest pins ${WANT})"
          [ "${GOT}" = "${WANT}" ] || { echo "::error::gtk4 is ${GOT}, expected ${WANT}"; exit 1; }
          # The built library must be a real ELF shared object with a SONAME.
          SO="$(ls -1 "${PREFIX}/lib/"libgtk-4.so.* 2>/dev/null | head -1)"
          if command -v readelf >/dev/null; then
            readelf -dW "${SO}" | grep -q 'SONAME' \
              || { echo "::error::${SO} has no SONAME"; exit 1; }
            # Confirm GTK linked against the system stack it was built on.
            readelf -dW "${SO}" | grep -Eq 'NEEDED.*(libglib-2\.0|libgobject-2\.0)' \
              || { echo "::error::libgtk-4 does not link glib/gobject"; exit 1; }
            echo "ok   libgtk-4 links the GLib stack"
          fi
          # The overlay's own GLib and Pango must be there and be the pinned releases.
          for m in glib-2.0 pango; do
            want="$(awk -v n="${m%%-*}" '$1==n{print $2}' linux/deps/manifest.txt)"
            got="$(pkg-config --modversion "$m")" \
              || { echo "::error::${m} not found in the overlay prefix"; exit 1; }
            [ "${got}" = "${want}" ] || { echo "::error::${m} is ${got}, manifest pins ${want}"; exit 1; }
            echo "ok   overlay ${m} ${got}"
          done
          echo "ok   gtk4 ${GOT} built and installed"

      - name: Stage artifact tree
        env:
          NORDSTJERNEN_LINUX_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/artifact"
          mkdir -p "${OUT}"
          cp -a "${NORDSTJERNEN_LINUX_SYSROOT}/${{ matrix.arch }}" "${OUT}/"
          cp linux/deps/manifest.txt "${OUT}/${{ matrix.arch }}/MANIFEST.txt"
          {
            echo "arch=${{ matrix.arch }}"
            echo "os=$(. /etc/os-release && echo "${PRETTY_NAME}")"
            echo "gtk=$(awk '$1=="gtk"{print $2}' linux/deps/manifest.txt)"
            echo "glib=$(awk '$1=="glib"{print $2}' linux/deps/manifest.txt)"
            echo "pango=$(awk '$1=="pango"{print $2}' linux/deps/manifest.txt)"
            echo "commit=${{ github.sha }}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "meson=$(meson --version)"
            echo "ninja=$(ninja --version)"
            echo "cmake=$(cmake --version | head -1 | awk '{print $3}')"
            echo "gcc=$(gcc -dumpfullversion 2>/dev/null || gcc -dumpversion)"
          } > "${OUT}/${{ matrix.arch }}/BUILDINFO.txt"

      - name: Upload GTK overlay artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nordstjernen-linux-gtk-${{ matrix.arch }}
          # Upload the parent dir so the artifact keeps a top-level <arch>/
          # directory (include/, lib/, lib/pkgconfig/) for the consumer.
          path: artifact/
          if-no-files-found: error
          retention-days: 90

  # Aggregate the arch(es) into a single public GitHub Release so the overlay is
  # downloadable with plain curl. Runs only when the build succeeds, and only on
  # main / manual / scheduled runs.
  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    # Publish ONLY from main: a workflow_dispatch from a feature branch must never
    # overwrite the public release that every engine build consumes. The nightly
    # schedule builds (to catch toolchain drift) but does not publish, so the
    # released assets change only when a commit on main changes them.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    permissions:
      contents: write
      id-token: write      # OIDC identity for the build-provenance attestation
      attestations: write  # store the attestation on this repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upstream configure/meson/cmake scripts from the tarballs run on this
          # runner; nothing here pushes with git, so never leave the token in .git.
          persist-credentials: false

      - name: Download all overlay artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nordstjernen-linux-gtk-*
          path: artifacts

      - name: Package per-arch tarballs and checksums
        run: |
          set -euo pipefail
          mkdir -p dist stage
          echo "== downloaded artifact tree =="; find artifacts -maxdepth 3 | sed 's/^/  /'
          for arch in x86_64; do
            # Locate the overlay by CONTENT rather than by guessing how
            # download-artifact nested it: the built gtk4.pc is always at
            # <overlay>/lib/pkgconfig/gtk4.pc, so its grandparent's parent is
            # the overlay root regardless of any wrapping directories.
            pc="$(find artifacts -type f -path '*/lib/pkgconfig/gtk4.pc' | head -1)"
            [ -n "${pc}" ] || { echo "::error::could not find gtk4.pc under artifacts/ for ${arch}"; exit 1; }
            src="$(cd "$(dirname "${pc}")/../.." && pwd)"
            # Restage under a clean <arch>/ so the tarball always extracts
            # straight into $NORDSTJERNEN_LINUX_SYSROOT/<arch>.
            rm -rf "stage/${arch}"; mkdir -p "stage/${arch}"
            cp -a "${src}/." "stage/${arch}/"
            tar -C stage -czf "dist/nordstjernen-linux-gtk-${arch}.tar.gz" "${arch}"
          done
          cp linux/deps/manifest.txt dist/manifest.txt
          ( cd dist && sha256sum ./*.tar.gz manifest.txt > SHA256SUMS )
          echo "== release assets =="; ls -lh dist

      # SLSA provenance signed by GitHub's OIDC identity for this workflow run.
      # Consumers verify with: gh attestation verify <asset> --repo <this repo>
      # (fetch-prebuilt-deps.sh does so automatically when gh is installed).
      # Signing talks to the Sigstore transparency log, which has outages
      # (Rekor answered 500 for hours on 2026-11-07). Retry twice with a pause;
      # if all attempts fail, warn loudly and still publish: a Sigstore outage
      # must not block a security update. The fetch scripts treat a missing
      # attestation as a warning (fatal with NORDSTJERNEN_REQUIRE_ATTESTATION=1)
      # and a present-but-invalid one as fatal.
      - name: Attest build provenance of the release assets (attempt 1)
        id: attest1
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nordstjernen-linux-gtk-*.tar.gz
            dist/SHA256SUMS

      - name: Pause before retrying the attestation
        if: steps.attest1.outcome == 'failure'
        run: sleep 45

      - name: Attest build provenance of the release assets (attempt 2)
        id: attest2
        if: steps.attest1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nordstjernen-linux-gtk-*.tar.gz
            dist/SHA256SUMS

      - name: Pause before the last attestation attempt
        if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure'
        run: sleep 90

      - name: Attest build provenance of the release assets (attempt 3)
        id: attest3
        if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nordstjernen-linux-gtk-*.tar.gz
            dist/SHA256SUMS

      - name: Report an unattested release
        if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure' && steps.attest3.outcome == 'failure'
        run: |
          echo "::warning title=Release assets are NOT attested::All three attestation attempts failed (Sigstore outage?). Publishing anyway; re-run this job once https://status.sigstore.dev is green to attach attestations."

      - name: Compute immutable release tag
        id: reltag
        run: echo "tag=linux-gtk-$(date -u +%Y%m%d)-${GITHUB_SHA::9}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable per-commit release ${{ steps.reltag.outputs.tag }}
        # The rolling '-latest' release below is overwritten in place, so it can
        # never be pinned. This copy is tied to the source commit and run number
        # and is never updated (a re-run of the same commit, e.g. to attest after
        # a Sigstore outage, creates a new release); consumers pin this tag in
        # their sysroot.lock.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Linux GTK overlay ${{ steps.reltag.outputs.tag }}
          make_latest: false
          body: |
            Immutable build of commit `${{ github.sha }}`. Same assets as the
            rolling `linux-gtk-latest` release at the time of publishing;
            see `manifest.txt` for the pinned versions and `SHA256SUMS` for checksums.
            Each asset carries a build-provenance attestation
            (`gh attestation verify <asset> --repo ${{ github.repository }}`).
          files: |
            dist/nordstjernen-linux-gtk-*.tar.gz
            dist/SHA256SUMS
            dist/manifest.txt
          fail_on_unmatched_files: true

      - name: Publish rolling 'linux-gtk-latest' release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: linux-gtk-latest
          name: Linux GTK overlay (latest)
          body: |
            Prebuilt development GTK 4 overlay for testing the desktop
            Nordstjernen engine on Ubuntu.

            - GTK: `${{ github.sha }}` build; pinned version in `manifest.txt`
            - Built on Ubuntu against the distro's system graphics stack
            - Arch: x86_64 (shared libraries)
            - Checksums in `SHA256SUMS`.

            The overlay contains GTK plus the GLib and Pango releases it requires
            (and wayland-protocols); every other dependency (cairo, gdk-pixbuf,
            graphene, libepoxy, harfbuzz, ...) comes from the system, so consume
            it on the same Ubuntu release it was built on.

            Consume with:
            ```bash
            export NORDSTJERNEN_LINUX_SYSROOT="$HOME/.cache/nordstjernen-linux-sysroot"
            linux/scripts/fetch-prebuilt-deps.sh --sysroot "$NORDSTJERNEN_LINUX_SYSROOT"
            ```
          files: |
            dist/nordstjernen-linux-gtk-*.tar.gz
            dist/SHA256SUMS
            dist/manifest.txt
          fail_on_unmatched_files: true
